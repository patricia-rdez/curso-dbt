version: 2

sources:
  - name: google_sheets
    database: "{{ env_var('DBT_BRONZE_DB') }}"
    schema: google_sheets
    tables:
      - name: budget
        columns:
          - name: _row
            data_tests:
              - not_null
              - unique
          - name: product_id
            data_tests:
              - relationships:
                 arguments:
                  to: source('sql_server_dbo', 'products')
                  field: product_id
          - name: quantity
            data_tests:
              - positive_values

sources:
  - name: google_sheets
    description: Base de datos
    config: 
      loaded_at_field: _loaded_at
      freshness:
        warn_after: {count: 24, period: hour} 
        error_after: {count: 48, period: hour}
    database: "{{ env_var('DBT_BRONZE_DB') }}"
    schema: google_sheets

    tables:
      - name: budget
        description: Presupuestos/pedidos
        columns:
          - name: _row
            description: Fila del pedido
          - name: product_id
            description: ID del producto
          - name: quantity
            description: Cantidad de productos pedidos
          - name: month
            description: Mes del pedido
          - name: _fivetran_synced
            description: Sincronizado con fivetran
          - name: _loaded_at
            description: Momento de carga del dato